- name: Wasona
  category: course
  description: "This website offers a full Toki Pona crash-course. It teaches vocabulary, grammar, and the sitelen pona writing system using Duolingo-style quizzes and exercises to boost retention. Available in many languages: English · čeština · dansk · Deutsch · español · français · magyar · italiano · polski · português · Tagalog · русский · українська · العربية · עברית" 
  link: https://wasona.com/
  img: https://wasona.com/favicon.png
- name: nimi.li
  category: reference
  description: "An interactive dictionary for Toki Pona that brings together defintions and notes from various sources. It also serves as a reference for various writing systems, the sign language Luka Pona, usage statistics, and more."
  link: https://nimi.li/
  img: https://nimi.li/favicon.png
- name: sona.pona.la
  category: reference
  description: "Toki Pona's community wiki, a treasure trove of articles, links and information about language, its community, and its history. "
  link: https://sona.pona.la/
  img: https://static.wikitide.net/sonaponawiki/e/ec/sona_pona_%28provisional%29.png
- name: "o pilin e toki pona #opetp"
  category: course
  description: Using comprehensible input, jan Telakoman uses pictures and gestures to get you learning Toki Pona subconsciously through immersion. Thirty videos designed to be watched over one month; are you up to the challenge?
  link: https://youtube.com/playlist?list=PLwYL9_SRAk8EXSZPSTm9lm2kD_Z1RzUgm
  img: /sitelen/resources/opetp.png
- name: Learn Toki Pona!
  category: course
  description: In this video series, jan Kekan San teaches introductory Toki Pona alongside its sitelen pona writing system using engaging lectures and a virtual whiteboard. Also, he's a literal star. 
  link: https://www.youtube.com/playlist?list=PLoLQoll2U6WEeCO7C2oc1LTWgkoBC8rvT
  img: /sitelen/resources/munKS.jpg
- name: lipu sona pona
  category: course
  description: Made by jan Lentan in 2021 and translated to German, Spanish, Esperanto, Polish, Portuguese, Russian and Chinese, this text-based course teaches the language's grammar and vocaulary in  13 lessons and various translation excercises. 
  link: https://lipu-sona.pona.la/
  img: /sitelen/resources/janLentan.png
- name: lipu sona mi pi toki pona
  category: course
  description: A cute, colourful course designed by soweli Sika in 2022. Translated to French, Italian, and Norwegian. 
